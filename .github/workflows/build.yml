name: build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust（含交叉 target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      - name: 打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '摸鱼小狐 v__VERSION__'
          releaseDraft: true
          args: --target ${{ matrix.target }}

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 发送微信通知
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            CONTENT='✅ 摸鱼小狐打包成功：mac(arm64/x64) + Windows(x64) 三个安装包已生成'
          else
            CONTENT='❌ 摸鱼小狐打包失败，请到 Actions 页面查看日志'
          fi
          curl -s -X POST "${{ secrets.WECHAT_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"${CONTENT}\"}}"

